name: Release

# Changesets: opens/updates a release PR with version bumps + changelog;
# merging that PR publishes to npm (prepack rebuilds lib automatically).
on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # OIDC token for npm provenance attestations (requires a public repo).
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Sign each published version with a link to this CI run/commit.
          NPM_CONFIG_PROVENANCE: true
